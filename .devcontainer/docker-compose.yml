services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-24-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: wardrobe
      DB_PASSWORD: wardrobe_dev_password
      DB_NAME: digital_wardrobe
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: digital_wardrobe
      MARIADB_USER: wardrobe
      MARIADB_PASSWORD: wardrobe_dev_password
      MARIADB_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../sql/digital_wardrobe.sql:/docker-entrypoint-initdb.d/01-digital-wardrobe.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mariadb-data:
